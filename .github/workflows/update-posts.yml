name: Update posts index

on:
  push:
    branches: [main]
    paths:
      - "posts/**.html"

jobs:
  patch-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run generate_posts.py
        run: python scripts/generate_posts.py

      - name: Commit updated index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "No changes, skipping commit." && exit 0
          git add index.html
          git commit -m "chore[site]: auto-update posts section in index.html"
          git push
